<svg xmlns="http://www.w3.org/2000/svg" width="880" height="576" viewBox="0 0 880 576">
<g>
  <rect x="0.5" y="0.5" width="879" height="251" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g transform="translate(22 22)" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></g>
  <text x="58" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">You decide what&#8217;s saved, shared and used</text>
  <text x="58" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">Per project or for all of them, in Settings or through your agent.</text>
  <g transform="translate(22 88)">
  <rect x="0.5" y="0.5" width="267" height="141" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Saved</text>
  <text x="18" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">Your prompts, commands, their</text>
  <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">output and files touched: each</text>
  <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">off, or kept on this computer.</text>
  </g>
  <g transform="translate(306 88)">
  <rect x="0.5" y="0.5" width="267" height="141" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Shared</text>
  <text x="18" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">Records go out with git push</text>
  <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">only if you turn it on. A preset</text>
  <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">picks which fields they carry.</text>
  <text x="18" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">Local only sends nothing.</text>
  </g>
  <g transform="translate(590 88)">
  <rect x="0.5" y="0.5" width="267" height="141" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Used</text>
  <text x="18" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">How much your agent is shown:</text>
  <text x="18" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">past attempts as it works, only</text>
  <text x="18" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">when a session starts, or only</text>
  <text x="18" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">when it asks.</text>
  </g>
</g>
<g transform="translate(0 272)">
  <rect x="0.5" y="0.5" width="429" height="141" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g transform="translate(22 22)" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>
  <text x="58" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Status and goals</text>
  <text x="22" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">What&#8217;s in progress, done and next, and your goals,</text>
  <text x="22" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">kept current and given back to your agent after</text>
  <text x="22" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">its context is compacted.</text>
</g>
<g transform="translate(450 272)">
  <rect x="0.5" y="0.5" width="429" height="141" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g transform="translate(22 22)" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></g>
  <text x="58" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Dead ends, with reasons</text>
  <text x="22" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">Every attempt, kept or abandoned, with the agent&#8217;s</text>
  <text x="22" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">reason. The next agent sees the dead ends before</text>
  <text x="22" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">it repeats one.</text>
</g>
<g transform="translate(0 434)">
  <rect x="0.5" y="0.5" width="429" height="141" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g transform="translate(22 22)" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
  <text x="58" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Where things came from</text>
  <text x="22" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">Each number keeps the command that printed it,</text>
  <text x="22" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">and each page or paper an agent read is kept</text>
  <text x="22" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">with the attempts that relied on it.</text>
</g>
<g transform="translate(450 434)">
  <rect x="0.5" y="0.5" width="429" height="141" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g transform="translate(22 22)" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 5-10 5L2 8l10-5ZM2 12l10 5 10-5M2 16l10 5 10-5"/></g>
  <text x="58" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328">Project map</text>
  <text x="22" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">The parts of your code and how they connect, from</text>
  <text x="22" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">the imports and your agents&#8217; own notes.</text>
</g>
</svg>
