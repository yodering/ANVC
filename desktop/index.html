<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANVC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 1024 1024%27%3E%3Crect x=%2764%27 y=%2764%27 width=%27896%27 height=%27896%27 rx=%27200%27 fill=%27%23171615%27/%3E%3Cg transform=%27translate(176 176) scale(28)%27 fill=%27none%27 stroke=%27%23e9a23b%27 stroke-width=%271.8%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27m12 3 10 5-10 5L2 8l10-5ZM2 12l10 5 10-5M2 16l10 5 10-5%27/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* Shown for the second the work log server takes to start. Same ground and
     type as the work log, so the swap to it reads as one app, not two. */
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0a0a0a;
    color: #ededed;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
  }
  main { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 24px; }
  .mark {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid #292929; border-top-color: #f5a524;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .mark { animation: none; border-color: #f5a524; } }
  #msg { font-size: 17px; }
  #detail { color: #a6a6a6; font-size: 15px; max-width: 52ch; overflow-wrap: anywhere; }
  body.failed .mark { animation: none; border-color: #f5736a; }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <div id="msg" role="status">Opening the work log…</div>
    <div id="detail"></div>
  </main>
</body>
</html>
